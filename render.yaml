databases:
  - name: employee-db
    plan: free
    databaseName: employee_db
    user: employee_user

services:
  - type: web
    name: employee-management
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: employee-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"