<!-- templates/employee_sidebar.html -->
<aside class="employee-sidebar" id="sidebar">
    <!-- Company Logo -->
    <div class="sidebar-header">
        <a href="{% url 'employee_dashboard' %}" class="logo">
            <div class="logo-icon">C</div>
            <div class="logo-text">Consups<span>.</span></div>
        </a>
    </div>

    <!-- Optional Search Bar -->
    <div class="sidebar-search">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search...">
        </div>
    </div>

    <!-- ===== SECTION 1: MAIN ===== -->
    <div class="nav-section">
        <h3>MAIN</h3>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="{% url 'employee_dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'employee_dashboard' %}active{% endif %}">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'employee_tasks' %}" class="nav-link {% if request.resolver_match.url_name == 'employee_tasks' %}active{% endif %}">
                    <i class="fas fa-tasks"></i>
                    <span>My Tasks</span>
                    {% if pending_tasks > 0 %}
                    <span class="badge">{{ pending_tasks }}</span>
                    {% endif %}
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'employee_project_dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'employee_project_dashboard' %}active{% endif %}">
                    <i class="fas fa-project-diagram"></i>
                    <span>My Projects</span>
                </a>
            </li>
        </ul>
    </div>

    

    <!-- ===== SECTION 3: LEAVE ===== -->
    <div class="nav-section">
        <h3>LEAVE</h3>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="{% url 'apply_leave' %}" class="nav-link {% if request.resolver_match.url_name == 'apply_leave' %}active{% endif %}">
                    <i class="fas fa-calendar-plus"></i>
                    <span>Request Leave</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'leave_history' %}" class="nav-link {% if request.resolver_match.url_name == 'leave_history' %}active{% endif %}">
                    <i class="fas fa-history"></i>
                    <span>Leave History</span>
                    {% if pending_leave_count > 0 %}
                    <span class="badge">{{ pending_leave_count }}</span>
                    {% endif %}
                </a>
            </li>
        </ul>
    </div>

    <!-- ===== SECTION 4: PAYROLL ===== -->
    <div class="nav-section">
        <h3>PAYROLL</h3>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="{% url 'employee_payrolls' %}" class="nav-link {% if request.resolver_match.url_name == 'employee_payrolls' %}active{% endif %}">
                    <i class="fas fa-file-invoice"></i>
                    <span>Payslips</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- ===== SECTION 5: SYSTEM ===== -->
    <div class="nav-section" style="margin-top: auto;">
        <h3>SYSTEM</h3>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="{% url 'logout' %}" class="nav-link">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </li>
        </ul>
    </div>
</aside>
<style>
    /* ===== EXACT SAME CSS FROM YOUR DASHBOARD WITH #2563EB ===== */
    :root {
        --primary-color: #2563EB;
        --primary-hover: #2563EB;
        --success-color: #10b981;
        --warning-color: #f59e0b;
        --danger-color: #ef4444;
        --dark-bg: #0f172a;
        --card-bg: #1e293b;
        --border-color: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --sidebar-width: 280px;
    }

    .employee-sidebar {
        width: var(--sidebar-width);
        background: var(--card-bg);
        border-right: 1px solid var(--border-color);
        position: fixed;
        height: 100vh;
        overflow-y: auto;
        padding: 24px 16px;
        box-shadow: 4px 0 10px rgba(0, 0, 0, 0.3);
    }

    /* Company Logo */
    .sidebar-header {
        margin-bottom: 30px;
        padding: 0 12px;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
    }

    .logo-icon {
        width: 40px;
        height: 40px;
        background: #2563EB;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 700;
        color: white;
        box-shadow: 0 8px 16px -4px rgba(37, 99, 235, 0.3);
        transition: all 0.3s ease;
    }

    .logo:hover .logo-icon {
        transform: scale(1.05);
        background: #2563EB;
        box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.5);
    }

    .logo-text {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.02em;
    }

    .logo-text span {
        color: #2563EB;
    }

    .logo:hover .logo-text {
        color: #2563EB;
    }

    .logo:hover .logo-text span {
        color: white;
    }

    .sidebar-search {
        margin-bottom: 24px;
        padding: 0 12px;
    }

    .search-box {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 10px 14px;
        gap: 10px;
        transition: all 0.2s ease;
    }

    .search-box:focus-within {
        border-color: #2563EB;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    .search-box i {
        color: var(--text-muted);
        font-size: 16px;
    }

    .search-box input {
        background: transparent;
        border: none;
        outline: none;
        width: 100%;
        color: var(--text-primary);
        font-size: 14px;
    }

    .search-box input::placeholder {
        color: var(--text-muted);
    }

    /* Navigation Sections */
    .nav-section {
        margin-bottom: 28px;
    }

    .nav-section h3 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        margin-bottom: 12px;
        padding-left: 16px;
        font-weight: 600;
    }

    .nav-menu {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .nav-item {
        margin-bottom: 2px;
    }

    .nav-link {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        color: var(--text-secondary);
        text-decoration: none;
        border-radius: 10px;
        transition: all 0.2s ease;
        gap: 12px;
        font-size: 14px;
        font-weight: 500;
        position: relative;
    }

    .nav-link i {
        width: 20px;
        font-size: 18px;
        color: var(--text-muted);
        transition: all 0.2s ease;
    }

    .nav-link:hover {
        background: rgba(37, 99, 235, 0.15);
        color: var(--text-primary);
    }

    .nav-link:hover i {
        color: #2563EB;
    }

    .nav-link.active {
        background: linear-gradient(90deg, rgba(37, 99, 235, 0.2), transparent);
        border-left: 3px solid #2563EB;
        color: var(--text-primary);
    }

    .nav-link.active i {
        color: #2563EB;
    }

    .nav-link.active::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 20px;
        background: #2563EB;
        border-radius: 0 3px 3px 0;
    }

    .nav-link .badge {
        margin-left: auto;
        background: #2563EB;
        color: white;
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .nav-link:hover .badge {
        background: #2563EB;
        transform: scale(1.05);
    }

    /* Scrollbar */
    .employee-sidebar::-webkit-scrollbar {
        width: 6px;
    }

    .employee-sidebar::-webkit-scrollbar-track {
        background: #1e293b;
    }

    .employee-sidebar::-webkit-scrollbar-thumb {
        background: #2563EB;
        border-radius: 3px;
    }

    .employee-sidebar::-webkit-scrollbar-thumb:hover {
        background: #2563EB;
    }
</style>
