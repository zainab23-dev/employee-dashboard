<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Project | Admin</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f1f5f9; }
        .dashboard-wrapper { display: flex; }
        .sidebar { width: 280px; background: white; height: 100vh; position: fixed; }
        .main-content { flex: 1; margin-left: 280px; padding: 30px; }
        
        .top-bar {
            background: white; border-radius: 15px; padding: 20px 30px;
            margin-bottom: 30px; display: flex; justify-content: space-between;
            align-items: center;
        }
        
        .form-container {
            background: white; border-radius: 15px; padding: 30px;
            max-width: 800px; margin: 0 auto;
        }
        
        .form-group { margin-bottom: 20px; }
        label {
            display: block; font-weight: 600; margin-bottom: 8px;
            color: #1e293b;
        }
        input, select, textarea {
            width: 100%; padding: 12px;
            border: 2px solid #e2e8f0; border-radius: 8px;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: #2563eb;
        }
        
        .form-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }
        
        .member-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
            max-height: 300px; overflow-y: auto; padding: 10px;
            border: 2px solid #e2e8f0; border-radius: 8px;
        }
        
        .member-card {
            background: #f8fafc; border: 1px solid #e2e8f0;
            border-radius: 8px; padding: 10px; display: flex;
            align-items: center; gap: 10px;
        }
        .member-card input[type="checkbox"] {
            width: auto; margin-right: 5px;
        }
        
        .btn-primary {
            background: #2563eb; color: white; padding: 12px 24px;
            border: none; border-radius: 8px; font-weight: 600;
            cursor: pointer; width: 100%;
        }
        .btn-secondary {
            background: #e2e8f0; color: #1e293b; padding: 12px 24px;
            border: none; border-radius: 8px; font-weight: 600;
            cursor: pointer; text-decoration: none; display: inline-block;
        }
        
        .info-text {
            font-size: 12px; color: #64748b; margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">
        {% include 'admin_sidebar.html' %}
        
        <div class="main-content">
            <div class="top-bar">
                <div>
                    <h1 style="font-size: 24px;">Create New Project</h1>
                    <p style="color: #64748b;">Set up a new project with team</p>
                </div>
                <a href="{% url 'admin_project_list' %}" class="btn-secondary">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
            </div>
            
            <div class="form-container">
                <form method="post" id="projectForm">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label>Project Title *</label>
                        <input type="text" name="title" required placeholder="e.g., Website Redesign">
                    </div>
                    
                    <div class="form-group">
                        <label>Description *</label>
                        <textarea name="description" rows="4" required placeholder="Describe the project..."></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Start Date *</label>
                            <input type="date" name="start_date" required value="{% now 'Y-m-d' %}">
                        </div>
                        <div class="form-group">
                            <label>End Date *</label>
                            <input type="date" name="end_date" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Select Team *</label>
                            <select name="team" id="teamSelect" required onchange="loadTeamMembers()">
                                <option value="">-- Select Team --</option>
                                {% for team in teams %}
                                <option value="{{ team.id }}">{{ team.name }} ({{ team.member_count }} members)</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Priority</label>
                            <select name="priority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                                <option value="critical">Critical</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Budget</label>
                        <input type="number" name="budget" step="0.01" placeholder="e.g., 50000">
                    </div>
                    
                    <!-- Team Members Selection -->
                    <div class="form-group" id="memberSection" style="display: none;">
                        <label>Select Team Members for Project</label>
                        <div class="member-grid" id="membersGrid"></div>
                        <div class="info-text">
                            <i class="fas fa-info-circle"></i> Select members to include in this project
                        </div>
                    </div>
                    
                    <!-- Project Leader Selection -->
                    <div class="form-group" id="leaderSection" style="display: none;">
                        <label>Project Leader *</label>
                        <select name="project_leader" id="leaderSelect" required>
                            <option value="">-- Select Leader --</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn-primary">Create Project</button>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        // Team members data from backend
        const teamMembers = {
            {% for team in teams %}
            {{ team.id }}: [
                {% for member in team.members.all %}
                { id: {{ member.id }}, name: "{{ member.username }}", email: "{{ member.email }}" },
                {% endfor %}
            ],
            {% endfor %}
        };

        function loadTeamMembers() {
            const teamId = document.getElementById('teamSelect').value;
            const memberSection = document.getElementById('memberSection');
            const leaderSection = document.getElementById('leaderSection');
            const membersGrid = document.getElementById('membersGrid');
            const leaderSelect = document.getElementById('leaderSelect');
            
            if (!teamId) {
                memberSection.style.display = 'none';
                leaderSection.style.display = 'none';
                return;
            }

            const members = teamMembers[teamId] || [];
            
            // Clear
            membersGrid.innerHTML = '';
            leaderSelect.innerHTML = '<option value="">-- Select Leader --</option>';
            
            // Add members
            members.forEach(member => {
                // Member checkbox
                const card = document.createElement('div');
                card.className = 'member-card';
                card.innerHTML = `
                    <input type="checkbox" name="selected_members" value="${member.id}" checked>
                    <div>
                        <strong>${member.name}</strong>
                        <div style="font-size: 11px; color: #64748b;">${member.email}</div>
                    </div>
                `;
                membersGrid.appendChild(card);
                
                // Leader option
                const option = document.createElement('option');
                option.value = member.id;
                option.textContent = `${member.name} (${member.email})`;
                leaderSelect.appendChild(option);
            });

            memberSection.style.display = 'block';
            leaderSection.style.display = 'block';
        }
    </script>
</body>
</html>
