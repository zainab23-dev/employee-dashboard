<div id="notificationBell" style="position: relative; cursor: pointer;">
    <i class="fas fa-bell"></i>
    <span id="notificationBadge" style="position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; display: flex; align-items: center; justify-content: center; display: none;">0</span>
</div>

<div id="notificationDropdown" style="display: none; position: absolute; top: 40px; right: 0; width: 300px; background: white; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 1000;">
    <div style="padding: 15px; border-bottom: 1px solid #e2e8f0;">
        <h4 style="font-size: 14px;">Notifications</h4>
    </div>
    <div id="notificationList" style="max-height: 300px; overflow-y: auto;">
        <!-- Notifications will be loaded here -->
    </div>
    <div style="padding: 10px; text-align: center; border-top: 1px solid #e2e8f0;">
        <a href="#" style="color: #2563eb; font-size: 12px; text-decoration: none;">View all</a>
    </div>
</div>

<script>
    function loadNotifications() {
        fetch('{% url "get_notifications" %}')
            .then(response => response.json())
            .then(data => {
                const badge = document.getElementById('notificationBadge');
                if (data.unread_count > 0) {
                    badge.style.display = 'flex';
                    badge.textContent = data.unread_count > 9 ? '9+' : data.unread_count;
                } else {
                    badge.style.display = 'none';
                }
                
                const list = document.getElementById('notificationList');
                list.innerHTML = '';
                
                if (data.notifications.length === 0) {
                    list.innerHTML = '<div style="padding: 20px; text-align: center; color: #94a3b8;">No notifications</div>';
                } else {
                    data.notifications.forEach(n => {
                        const item = document.createElement('div');
                        item.className = 'notification-item';
                        item.style.cssText = 'padding: 10px; border-bottom: 1px solid #e2e8f0; cursor: pointer;' + (n.is_read ? '' : 'background: #f0f9ff;');
                        item.innerHTML = `
                            <div style="font-size: 12px; font-weight: 600;">${n.message}</div>
                            <div style="font-size: 10px; color: #64748b; margin-top: 3px;">${n.created_at}</div>
                        `;
                        item.onclick = function() {
                            if (!n.is_read) {
                                markNotificationRead(n.id);
                            }
                            if (n.link) {
                                window.location.href = n.link;
                            }
                        };
                        list.appendChild(item);
                    });
                }
            });
    }

    function markNotificationRead(id) {
        fetch(`/notifications/${id}/read/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        })
        .then(() => loadNotifications());
    }

    // Toggle dropdown
    document.getElementById('notificationBell')?.addEventListener('click', function(e) {
        e.stopPropagation();
        const dropdown = document.getElementById('notificationDropdown');
        dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        loadNotifications();
    });

    // Click outside to close
    document.addEventListener('click', function(e) {
        const dropdown = document.getElementById('notificationDropdown');
        const bell = document.getElementById('notificationBell');
        if (!bell.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.style.display = 'none';
        }
    });

    // Load notifications every 30 seconds
    loadNotifications();
    setInterval(loadNotifications, 30000);
</script>
